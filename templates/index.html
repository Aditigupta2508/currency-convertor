<!DOCTYPE html>
<html>
<head>
    <title>SprintGlobalPay</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        /* ===== THEME VARIABLES ===== */
        :root {
            --bg-gradient: linear-gradient(135deg, #f3a6a6, #f0c0c0, #eaeaea);
            --card-bg: rgba(255,255,255,0.95);
            --text-color: #000;
            --input-bg: #fff;
            --border-color: #000;
            --btn-gradient: linear-gradient(to right, #7b4397, #dc2430);
            --dropdown-hover: rgb(129, 106, 156);
            --result-bg: #f1f1f1;
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #121212, #1f1f1f);
            --card-bg: #555555;
            --text-color: #fff;
            --input-bg: #2a2a2a;
            --border-color: #555;
            --btn-gradient: linear-gradient(to right, #232526, #414345);
            --dropdown-hover: #333;
            --result-bg: #6f6f6f;
        }

        * {
            box-sizing: border-box;
            font-family: Georgia, serif;
            color: var(--text-color);
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.4s;
        }

        .page {
            width: 420px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 32px;
            font-weight: bold;
        }

        .theme-btn {
            cursor: pointer;
            font-size: 20px;
            border: none;
            background: none;
        }

        .card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            transition: 0.4s;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .dropdown {
            position: relative;
            width: 45%;
        }

        .dropdown-btn {
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: var(--input-bg);
            cursor: pointer;
        }

        .dropdown-list {
            display: none;
            position: absolute;
            width: 150%;
            max-height: 220px;
            overflow-y: auto;
            background: var(--input-bg);
            border-radius: 12px;
            margin-top: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .dropdown-list div {
            padding: 10px;
            cursor: pointer;
        }

        .dropdown-list div:hover {
            background: var(--dropdown-hover);
        }

        .swap-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #7b4397;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button.action {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: var(--btn-gradient);
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #result, #rateResult {
            background: var(--result-bg);
            padding: 15px;
            border-radius: 14px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="top-bar">
        <div class="main-title">💱 Sprint Global Pay</div>
        <button class="theme-btn" onclick="toggleTheme()" id="themeIcon">🌙</button>
    </div>

    <div class="card">

        <label>Enter Amount</label>
        <input type="number" id="amount" placeholder="Enter Amount">

        <label>Currency</label>
        <div class="row">

            <div class="dropdown">
                <div class="dropdown-btn" onclick="toggle('fromList')" id="fromBtn">Loading...</div>
                <div class="dropdown-list" id="fromList"></div>
            </div>

            <button class="swap-btn" onclick="swap()">⇄</button>

            <div class="dropdown">
                <div class="dropdown-btn" onclick="toggle('toList')" id="toBtn">Loading...</div>
                <div class="dropdown-list" id="toList"></div>
            </div>

        </div>

        <button class="action" onclick="convertCurrency()">Convert</button>
        <div id="result"></div>

        <button class="action" onclick="getRate()">Get Exchange Rate</button>
        <div id="rateResult"></div>

    </div>
</div>

<script>
let fromCurrency = "";
let toCurrency = "";

/* ===== THEME TOGGLE ===== */
function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    document.getElementById("themeIcon").innerText =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    document.getElementById("themeIcon").innerText = "☀️";
}

/* ===== CURRENCY LOGIC ===== */
window.onload = function () {
    fetch("/currencies")
        .then(res => res.json())
        .then(data => {
            const fromList = document.getElementById("fromList");
            const toList = document.getElementById("toList");

            for (const code in data) {
                let name = `${code} - ${data[code]}`;

                let f = document.createElement("div");
                f.innerText = name;
                f.onclick = () => selectFrom(code, name);
                fromList.appendChild(f);

                let t = document.createElement("div");
                t.innerText = name;
                t.onclick = () => selectTo(code, name);
                toList.appendChild(t);
            }

            selectFrom("USD", "USD - US Dollar");
            selectTo("INR", "INR - Indian Rupee");
        });
};

function toggle(id) {
    let el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
}

function selectFrom(code, text) {
    fromCurrency = code;
    document.getElementById("fromBtn").innerText = text;
    document.getElementById("fromList").style.display = "none";
}

function selectTo(code, text) {
    toCurrency = code;
    document.getElementById("toBtn").innerText = text;
    document.getElementById("toList").style.display = "none";
}

function swap() {
    [fromCurrency, toCurrency] = [toCurrency, fromCurrency];
    let temp = fromBtn.innerText;
    fromBtn.innerText = toBtn.innerText;
    toBtn.innerText = temp;
}

function convertCurrency() {
    let amt = amount.value;
    if (!amt) return alert("Enter amount");

    fetch(`/convert?from=${fromCurrency}&to=${toCurrency}&amount=${amt}`)
        .then(r => r.json())
        .then(d => result.innerText = `${amt} ${fromCurrency} = ${d.convertedAmount} ${toCurrency}`);
}

function getRate() {
    fetch(`/rate?from=${fromCurrency}&to=${toCurrency}`)
        .then(r => r.json())
        .then(d => rateResult.innerText = `1 ${fromCurrency} = ${d.rate} ${toCurrency}`);
}
</script>

</body>
</html>
